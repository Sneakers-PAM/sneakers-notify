syntax = "proto3";

package sneakers.notify.v1;

option go_package = "github.com/Sneakers-PAM/sneakers-notify/gen/go/sneakers/notify/v1;notifyv1";

// NotifyService is the ephemeral, best-effort Informed-notification inbox.
// The durable record of every event is the audit chain; this service is a
// convenience view stored in Redis.
service NotifyService {
  // NotifyEvent fans an Informed event out to recipient inboxes (best-effort).
  rpc NotifyEvent(NotifyEventRequest) returns (NotifyEventResponse);
  // ListNotifications returns a user's inbox, newest first.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  // UnreadCount returns a user's unread badge count.
  rpc UnreadCount(UnreadCountRequest) returns (UnreadCountResponse);
  // MarkRead marks one item read.
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  // MarkAllRead marks a user's whole inbox read.
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkAllReadResponse);
}

// InformedSubject is one subject of an Informed rule: everyone, a group or a user.
message InformedSubject {
  string kind = 1; // "everyone" | "group" | "user"
  string name = 2; // group name or user id; empty for everyone
}

message NotifyEventRequest {
  string action = 1;        // e.g. "secret.reveal"
  string resource_kind = 2; // "secret" | "folder"
  string resource_id = 3;
  string resource_label = 4;
  string actor_user_id = 5;
  string occurred_at = 6;   // RFC3339; server stamps now() if empty
  repeated InformedSubject informed_subjects = 7;
}
message NotifyEventResponse { int32 delivered = 1; }

message Notification {
  string id = 1;
  string action = 2;
  string resource_kind = 3;
  string resource_id = 4;
  string resource_label = 5;
  string actor_label = 6;
  string occurred_at = 7;
  bool read = 8;
}

message ListNotificationsRequest { string user_id = 1; int32 limit = 2; }
message ListNotificationsResponse { repeated Notification notifications = 1; }
message UnreadCountRequest { string user_id = 1; }
message UnreadCountResponse { int32 count = 1; }
message MarkReadRequest { string user_id = 1; string id = 2; }
message MarkReadResponse { bool ok = 1; }
message MarkAllReadRequest { string user_id = 1; }
message MarkAllReadResponse { bool ok = 1; }
